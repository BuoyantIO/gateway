name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, e.g. 0.1.0 (no v prefix). Required for publishing:
          the workflow creates the v<version> tag at the selected commit once
          the release succeeds, and fails upfront if that version was already
          released (its tag exists).
        type: string
        required: false
      publish:
        description: 'Publish the release (otherwise just dry-run); only allowed from the main branch'
        type: boolean
        required: false
        default: false
  # Every PR and every push to main gets a dry run: build, then e2e
  # against the release-named images. This is the repo's only e2e run
  # (ci.yml has none), so the path a release takes is the one tested.
  # Nothing is published; inputs are empty, so is_release is false and
  # the version falls back to 0.0.0-undefined.
  pull_request:
  push:
    branches: [main]

# Release runs must never be cancelled mid-flight; dispatches queue up
# behind one another. Dry runs stay out of that queue: one group per PR,
# where a new push cancels the previous run, and one per main commit.
concurrency:
  group: ${{ github.workflow }}${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  DOCKER_REGISTRY: ghcr.io/buoyantio

jobs:
  meta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate inputs
        run: |
          version='${{ inputs.version }}'
          if [[ -n $version && ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$version' is not semver (expected e.g. 0.1.0, without the v prefix)"
            exit 1
          fi
          if [[ '${{ inputs.publish }}' == true && -z $version ]]; then
            echo "::error::publish requires the version input"
            exit 1
          fi
          if [[ '${{ inputs.publish }}' == true && '${{ github.ref }}' != refs/heads/main ]]; then
            echo "::error::publish is only allowed from the main branch (got '${{ github.ref_name }}')"
            exit 1
          fi
          if [[ -n $version ]] && git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists: that version has already been released. Choose a new version."
            exit 1
          fi
      - id: release
        run: echo "is_release=${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "version=${{ inputs.version || '0.0.0-undefined' }}" >> "$GITHUB_OUTPUT"
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}

  # Build the release-named images once, for both platforms, as OCI
  # archives. Each test leg runs e2e against its own platform's image
  # from them, and publish pushes them unchanged, so the pushed
  # manifests are exactly the ones tested.
  build:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build images
        run: |
          version='${{ needs.meta.outputs.version }}'
          mkdir -p /tmp/images
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.cp \
            -t "$DOCKER_REGISTRY/gateway-cp:$version" \
            -o type=oci,dest=/tmp/images/gateway-cp.tar .
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile \
            -t "$DOCKER_REGISTRY/gatewayd:$version" \
            -o type=oci,dest=/tmp/images/gatewayd.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-images
          path: /tmp/images
          retention-days: 1

  # The publish gate: on each platform, install the chart from source
  # pointing at the build's images and run the full e2e suite. Nothing
  # is pushed unless every leg is green.
  test:
    needs: [meta, build]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          install_only: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gateway-images
          path: /tmp/images
      - name: Load images
        run: |
          version='${{ needs.meta.outputs.version }}'
          for image in gateway-cp gatewayd; do
            skopeo copy "oci-archive:/tmp/images/$image.tar" \
              "docker-archive:/tmp/$image-docker.tar:$DOCKER_REGISTRY/$image:$version"
            docker load -i "/tmp/$image-docker.tar"
          done
      - name: E2E against release images
        run: |
          just --no-deps \
               CP_IMAGE_REPO="$DOCKER_REGISTRY/gateway-cp" \
               CP_IMAGE_TAG="${{ needs.meta.outputs.version }}" \
               DP_IMAGE_REPO="$DOCKER_REGISTRY/gatewayd" \
               DP_IMAGE_TAG="${{ needs.meta.outputs.version }}" \
               image-echo up
          just test-e2e
        env:
          # Each test saves its namespace's pod logs and events here
          # before deleting the namespace.
          E2E_LOG_DIR: /tmp/e2e-logs/namespaces
      - name: Diagnostics
        if: failure()
        run: just diagnostics
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-logs-${{ matrix.os }}
          path: |
            /tmp/kind-logs
            /tmp/e2e-logs
          retention-days: 3

  ready-for-merge:
    name: Ready for merge (release)
    if: always()
    needs: [meta, build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'

  publish:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gateway-images
          path: /tmp/images
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: buoyantio
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        # skopeo is preinstalled on ubuntu-24.04 and reads docker login's
        # credentials. --preserve-digests fails rather than push anything
        # but the tested manifests.
        run: |
          version='${{ needs.meta.outputs.version }}'
          for image in gateway-cp gatewayd; do
            skopeo copy --all --preserve-digests "oci-archive:/tmp/images/$image.tar" \
              "docker://$DOCKER_REGISTRY/$image:$version"
          done
      - name: Publish charts
        # Both charts are versioned in lockstep: one release tag stamps
        # gateway-crds and gateway alike.
        run: |
          version='${{ needs.meta.outputs.version }}'
          for chart in gateway-crds gateway; do
            helm package "charts/$chart" \
              --version "$version" \
              --app-version "$version"
            helm push "$chart-$version.tgz" "oci://$DOCKER_REGISTRY/charts"
          done

  create_release_tag:
    # The tag is only created once the release has been fully published;
    # a failed run leaves no tag behind so the version can be retried.
    # Recreating an existing tag can't happen here: validation fails any
    # publish whose version was already released.
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/v${{ inputs.version }}" \
            -f sha="${{ github.sha }}"

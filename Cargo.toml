[workspace]
resolver = "2"
members = [
  "crates/gateway-config",
  "crates/gateway-state",
  "crates/gateway-drain",
  "crates/gateway-extension",
  "crates/gateway-extension-impls",
  "crates/gateway-runtime",
  "crates/gatewayd",
  "crates/gateway-cp-proto",
  "crates/gateway-cp-client",
  "crates/gateway-cp",
  "e2e",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gateway-config = { path = "crates/gateway-config" }
gateway-cp = { path = "crates/gateway-cp" }
gateway-cp-client = { path = "crates/gateway-cp-client" }
gateway-cp-proto = { path = "crates/gateway-cp-proto" }
gateway-drain = { path = "crates/gateway-drain" }
gateway-extension = { path = "crates/gateway-extension" }
gateway-extension-impls = { path = "crates/gateway-extension-impls" }
gateway-runtime = { path = "crates/gateway-runtime" }
gateway-state = { path = "crates/gateway-state" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = "4"
futures = "0.3"
gateway-api = "0.23"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5.1", default-features = false }
parking_lot = "0.13"
prometheus-client = "0.26"
prost = "0.14"
rand = "0.10"
regex = "1"
rustls = { version = "0.23", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

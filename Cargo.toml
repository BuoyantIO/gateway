[workspace]
resolver = "2"
members = [
  "crates/gateway-config",
  "crates/gateway-state",
  "crates/gateway-runtime",
  "crates/gatewayd",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

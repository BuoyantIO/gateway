apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePolicy
metadata: {name: by-model, namespace: default}
spec:
  rules:
  - name: SmolLM2-local
    matches:
    - model: dummy
    route:
      consider:
      - models: {names: [dummy]}
      select: [{type: Local, minimize: PredictedTTFT}]
  - name: qwen-provider
    matches:
    - model: [qwen-2.5, Qwen/Qwen2.5-32B-Instruct-Turbo]
    route:
      consider:
      - models: {names: [qwen-2.5]}
      select: [{type: Provider, order: [databricks]}]

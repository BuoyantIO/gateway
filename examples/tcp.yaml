gatewayConfig:
  name: tcp-example
  binds:
    - name: edge
      address: 127.0.0.1
      port: 7000
      bindProtocol: TCP
      listeners:
        - name: tcp-listener
          listenerProtocol: TCP
          routes:
            - name: tcp-route
              backendRefs:
                - name: upstream
              filters:
                - name: log
                  type: TcpConnectionLog
  backends:
    - name: upstream
      type: Static
      endpoints:
        - name: e0
          address: 127.0.0.1
          port: 8080

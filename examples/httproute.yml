apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: default
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: inference-d.io
          kind: InferencePool
          name: inference-all

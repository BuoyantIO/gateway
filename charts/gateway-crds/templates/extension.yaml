apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: extensions.gateway.linkerd.io
  annotations:
    # Uninstalling the chart orphans the CRD instead of cascade-deleting
    # every Extension in the cluster.
    helm.sh/resource-policy: keep
spec:
  group: gateway.linkerd.io
  scope: Namespaced
  names:
    kind: Extension
    listKind: ExtensionList
    plural: extensions
    singular: extension
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [class]
              properties:
                class:
                  description: >-
                    The registered extension class this object
                    instantiates. Class validity is a data-plane fact;
                    an unknown class fails the object there, never a
                    request.
                  type: string
                  minLength: 1
                failureMode:
                  description: >-
                    What a hook error does to the request. Closed
                    fails the request; Open logs and continues.
                  type: string
                  enum: [Closed, Open]
                  default: Closed
                limits:
                  description: >-
                    Operator ceilings clamping what the class's
                    builder may declare.
                  type: object
                  properties:
                    requestBody:
                      type: string
                      enum: ["None", Stream, Buffer]
                    maxBufferBytes:
                      type: integer
                      format: int64
                      minimum: 1
                allowedReferences:
                  description: >-
                    Which BackendBindings outside this object's
                    namespace may list it. Its own namespace is always
                    admitted.
                  type: object
                  properties:
                    namespaces:
                      type: object
                      properties:
                        from:
                          description: >-
                            Same admits only this namespace; All
                            admits every namespace.
                          type: string
                          enum: [Same, All]
                          default: Same
                config:
                  description: >-
                    Opaque class config, handed to the class verbatim.
                    The schema is the class's contract; the gateway
                    never reads a key inside it.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

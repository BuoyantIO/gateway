apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-cp
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway-cp
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: gateway-cp
  template:
    metadata:
      labels:
        app: gateway-cp
    spec:
      serviceAccountName: gateway-cp
      containers:
        - name: gateway-cp
          image: {{ include "gateway.cpImage" . }}
          imagePullPolicy: IfNotPresent
          args:
            - --listen=0.0.0.0:8443
            - --controller-name=gateway.buoyant.io/controller
            # Data-plane provisioning: the CP deploys a gatewayd
            # Deployment + Service per owned Gateway.
            - --dp-image={{ include "gateway.dpImage" . }}
            - --cp-url=http://gateway-cp.{{ .Release.Namespace }}.svc:8443
            - --admin-addr=0.0.0.0:15021
          ports:
            - name: grpc
              containerPort: 8443
            - name: admin
              containerPort: 15021
          # Ready once the watch caches have synced and the first
          # translated snapshot is servable; unready while draining.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: admin
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: admin
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz/alive
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: RUST_LOG
              value: info
            # Identity and Lease namespace for leader election.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

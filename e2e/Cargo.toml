[package]
name = "gateway-e2e"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "grpc_echo"
path = "src/bin/grpc_echo.rs"

[[bin]]
name = "openai_mock"
path = "src/bin/openai_mock.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
gateway-api.workspace = true
gateway-config.workspace = true
gateway-cp.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio"] }
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
prost.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "logging"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
tonic-prost-build.workspace = true

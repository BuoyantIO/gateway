[package]
name = "gatewayd"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gateway-config = { path = "../gateway-config" }
gateway-cp-client = { path = "../gateway-cp-client" }
gateway-runtime = { path = "../gateway-runtime" }
gateway-state = { path = "../gateway-state" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus-client = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

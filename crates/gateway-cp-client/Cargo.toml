[package]
name = "gateway-cp-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gateway-config = { path = "../gateway-config" }
gateway-cp-proto = { path = "../gateway-cp-proto" }
gateway-state = { path = "../gateway-state" }
http = "1"
rand = "0.9"
regex = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }

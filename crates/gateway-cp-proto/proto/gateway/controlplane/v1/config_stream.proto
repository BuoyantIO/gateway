// Control-plane <-> data-plane streaming protocol for the gateway.

syntax = "proto3";

package gateway.controlplane.v1;

service ConfigStream {
  // One stream per connected data plane. The DP opens the stream and
  // immediately sends Hello; the CP then pushes ConfigUpdate batches
  // until either side closes.
  rpc Watch(stream ConfigRequest) returns (stream ConfigUpdate);
}

// -------- DP -> CP --------

// Wrapped in a oneof so we can add Ack / Subscribe / Unsubscribe etc.
// later without a proto break. v0 carries only Hello.
message ConfigRequest {
  oneof kind {
    Hello hello = 1;
    // Reserved: Ack, Subscribe, Unsubscribe.
  }
}

// Sent once by the DP immediately after opening the stream. The CP uses
// `client_id` as the routing key to filter ConfigUpdates to resources
// attached to one specific Gateway.
message Hello {
  // K8s reference of the Gateway this DP serves:
  // "{namespace}/{gateway-name}". If the Gateway doesn't exist yet,
  // the DP receives an empty initial snapshot (just `sync_complete = true`
  // with no upserts) and is fed once the Gateway resource is created.
  string client_id = 1;
}

// -------- CP -> DP --------

message ConfigUpdate {
  repeated Upsert upserts = 1;
  repeated Remove removes = 2;

  // True on the final batch of the initial bootstrap stream. Subsequent
  // live deltas never set this. Triggers the DP's reconnect-purge diff.
  bool sync_complete = 3;
}

message Upsert {
  oneof body {
    BindUpsert      bind       = 10;
    ListenerUpsert  listener   = 11;
    HttpRouteUpsert http_route = 12;
    BackendUpsert   backend    = 13;
    SecretUpsert    secret     = 14;
    ExtensionUpsert extension  = 15;
  }
}

message Remove {
  oneof key {
    BindKey     bind       = 10;
    ListenerKey listener   = 11;
    RouteKey    http_route = 12;
    BackendKey  backend    = 13;
    SecretKey   secret     = 14;
    ExtensionKey extension  = 15;
  }
}

// -------- Identity keys --------

message BindKey     { string name = 1; }
message ListenerKey { string bind = 1; string name = 2; }
message RouteKey    { string bind = 1; string listener = 2; string name = 3; }
message BackendKey  { string name = 1; }
message SecretKey   { string namespace = 1; string name = 2; }
message ExtensionKey { string namespace = 1; string name = 2; }

// -------- Bind --------

enum BindProtocol {
  BIND_PROTOCOL_UNSPECIFIED = 0;
  BIND_PROTOCOL_HTTP        = 1;
  BIND_PROTOCOL_TLS         = 2;
}

message BindUpsert {
  string       name          = 1;
  string       address       = 2;  // textual IP, parsed to IpAddr on the DP
  uint32       port          = 3;  // u16
  BindProtocol bind_protocol = 4;
}

// -------- Listener --------

message ListenerUpsert {
  ListenerKey key          = 1;
  string      hostname     = 2;
  bool        has_hostname = 3;
  ListenerTls tls          = 4;
}

enum TlsMode {
  TLS_MODE_UNSPECIFIED = 0;
  TLS_MODE_TERMINATE   = 1;
  TLS_MODE_PASSTHROUGH = 2;
}

message ListenerTls {
  TlsMode            mode             = 1;
  repeated SecretKey certificate_refs = 2;
}

// -------- Secret --------

// What the material in `data` is, and therefore which data keys the
// DP expects to find. TLS carries its chain under "tls.crt" and its
// private key under "tls.key" (empty for a CA-only secret); opaque
// carries credentials under operator-chosen keys, named by whatever
// references them.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_TLS         = 1;
  SECRET_TYPE_OPAQUE      = 2;
}

message SecretUpsert {
  string             namespace = 1;
  string             name      = 2;
  SecretType         type      = 3;
  map<string, bytes> data      = 4;
}

// -------- Extension --------

enum FailureMode {
  FAILURE_MODE_UNSPECIFIED = 0;  // Closed (the default)
  FAILURE_MODE_CLOSED      = 1;
  FAILURE_MODE_OPEN        = 2;
}

enum RequestBodyLimit {
  REQUEST_BODY_LIMIT_UNSPECIFIED = 0;  // no ceiling
  REQUEST_BODY_LIMIT_NONE        = 1;
  REQUEST_BODY_LIMIT_STREAM      = 2;
  REQUEST_BODY_LIMIT_BUFFER      = 3;
}

message ExtensionLimits {
  RequestBodyLimit request_body     = 1;
  uint64           max_buffer_bytes = 2;  // 0 = no cap
}

message ExtensionUpsert {
  string          namespace    = 1;
  string          name         = 2;
  string          class        = 3;
  FailureMode     failure_mode = 4;
  ExtensionLimits limits       = 5;
  // The class's opaque config, as YAML. A string rather than a
  // structured value: the gateway never reads a key inside it, and
  // YAML keeps integers exact where a JSON-model Struct cannot.
  string          config_yaml  = 6;
}

// -------- HttpRoute --------

message HttpRouteUpsert {
  RouteKey            key          = 1;
  repeated HttpMatch  matches      = 2;
  repeated BackendRef backend_refs = 3;
  repeated HttpFilter filters      = 4;
}

message HttpMatch {
  string    host                              = 1;
  bool      has_host                          = 2;
  PathMatch path                              = 3;
  HttpMethod                method            = 4;  // METHOD_UNSPECIFIED == not set
  repeated HeaderMatch      header_matches    = 5;
  repeated QueryParamMatch  query_param_matches = 6;
}

message PathMatch {
  PathMatchKind kind  = 1;
  string        value = 2;
}

enum PathMatchKind {
  PATH_MATCH_KIND_UNSPECIFIED = 0;
  PATH_MATCH_KIND_PATH_PREFIX = 1;
  PATH_MATCH_KIND_EXACT       = 2;
  PATH_MATCH_KIND_REGEX       = 3;
}

// Mirrors Gateway API's closed set of HTTP methods.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET         = 1;
  HTTP_METHOD_HEAD        = 2;
  HTTP_METHOD_POST        = 3;
  HTTP_METHOD_PUT         = 4;
  HTTP_METHOD_DELETE      = 5;
  HTTP_METHOD_CONNECT     = 6;
  HTTP_METHOD_OPTIONS     = 7;
  HTTP_METHOD_TRACE       = 8;
  HTTP_METHOD_PATCH       = 9;
}

message HeaderMatch {
  string name = 1;
  oneof value {
    string exact = 2;
    string regex = 3;
  }
}

message QueryParamMatch {
  string name = 1;
  oneof value {
    string exact = 2;
    string regex = 3;
  }
}

message BackendRef {
  string name   = 1;
  uint32 weight = 2;
}

// One config carrier: every filter is a ref to an Extension object.
// The CP synthesizes objects for Gateway API core filters; fields
// 1-3 carried their typed configs before that.
message HttpFilter {
  reserved 1, 2, 3;
  reserved "request_header_modifier", "response_header_modifier", "request_redirect";
  oneof kind {
    ExtensionRef extension_ref = 4;
  }
}

// Runs the Extension object it names. The name is also the filter's
// identity within the rule.
message ExtensionRef {
  string name      = 1;
  string namespace = 2;  // "" = the route's own scope
}

// -------- Backend --------

enum BackendProtocol {
  BACKEND_PROTOCOL_UNSPECIFIED = 0;
  BACKEND_PROTOCOL_HTTP1       = 1;
  BACKEND_PROTOCOL_HTTP2       = 2;
}

// Two kinds, distinguished by what the gateway has to do to reach
// the destination: an endpoint set it balances over, or a single host
// it dials by name.
message BackendUpsert {
  string name = 1;
  oneof kind {
    EndpointSet endpoint_set = 2;
    Dialable    dialable     = 3;
  }
}

message EndpointSet {
  repeated Endpoint endpoints = 1;
  BackendProtocol   protocol  = 2;
}

message Endpoint {
  string name    = 1;
  string address = 2;  // textual IP
  uint32 port    = 3;
}

// A host the gateway dials by name. The CP has already parsed the
// operator's URL into these parts; the DP never sees a URL.
message Dialable {
  string host = 1;  // hostname or literal IP, resolved at dial time
  uint32 port = 2;  // u16, never 0
  // Prepended to the request path on the way upstream. "" = unset:
  // a prefix must be absolute, so the empty string is never a
  // legitimate value.
  string path_prefix = 3;
  // Unset dials the host in the clear.
  BackendTls  tls  = 4;
  // Unset sends no credential.
  BackendAuth auth = 5;
}

// Client-side TLS the gateway originates to a dialable backend.
message BackendTls {
  // The CA-only Secret whose chain becomes the only trust root.
  // Unset uses the platform trust store.
  SecretKey ca = 1;
  // Sent as SNI and verified against the upstream certificate.
  // "" = unset, which falls back to the backend's host.
  string sni = 2;
  // Offered in the handshake, in preference order, and therefore
  // what decides the HTTP version upstream. Empty offers no ALPN.
  repeated AlpnProtocol alpn = 3;
  bool insecure_skip_verify  = 4;
}

enum AlpnProtocol {
  ALPN_PROTOCOL_UNSPECIFIED = 0;
  ALPN_PROTOCOL_H2          = 1;
  ALPN_PROTOCOL_HTTP11      = 2;
}

// How the gateway authenticates itself to a dialable backend. Every
// scheme spends exactly one secret.
message BackendAuth {
  oneof kind {
    ApiKeyAuth api_key = 1;
    OAuth2Auth oauth2  = 2;
  }
}

// A credential sent verbatim in one header. The CP resolves the
// defaults, so `header` is always set and `prefix` is exactly what
// goes in front of the credential ("" = nothing).
//
// A credential is named by a secret plus a data key, because an
// opaque secret's keys are the operator's to choose. TLS material is
// named by the secret alone, since kubernetes.io/tls fixes its keys.
message ApiKeyAuth {
  SecretKey secret   = 1;
  string    data_key = 2;
  string    header   = 3;
  string    prefix   = 4;
}

// The OAuth2 client-credentials grant. Where the token goes is not
// configurable: a bearer token is sent as `Authorization: Bearer`.
message OAuth2Auth {
  string           token_url          = 1;  // absolute http(s) URL
  string           client_id          = 2;
  // The secret holding the client secret, and the data key inside it.
  SecretKey        secret             = 3;
  string           data_key           = 4;
  repeated string  scopes             = 5;
  ClientAuthMethod client_auth_method = 6;
}

// How the client secret is presented to the token endpoint
// (RFC 6749 2.3.1). Unspecified is Basic, which is the method the
// RFC says a client SHOULD use.
enum ClientAuthMethod {
  CLIENT_AUTH_METHOD_UNSPECIFIED         = 0;
  CLIENT_AUTH_METHOD_CLIENT_SECRET_BASIC = 1;
  CLIENT_AUTH_METHOD_CLIENT_SECRET_POST  = 2;
}

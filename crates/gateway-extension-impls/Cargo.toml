[package]
name = "gateway-extension-impls"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
gateway-config = { path = "../gateway-config" }
gateway-extension = { path = "../gateway-extension" }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
prost = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"

[dev-dependencies]
gateway-state = { path = "../gateway-state" }
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing-subscriber = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"

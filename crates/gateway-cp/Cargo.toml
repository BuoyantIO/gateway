[package]
name = "gateway-cp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gateway-config.workspace = true
gateway-cp-proto.workspace = true
gateway-drain.workspace = true
gateway-state.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
futures.workspace = true
gateway-api.workspace = true
http.workspace = true
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true, features = ["client", "derive", "runtime", "rustls-tls", "aws-lc-rs"] }
parking_lot.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
tower-test = "0.4"

[package]
name = "gateway-runtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
form_urlencoded = "1"
gateway-config = { path = "../gateway-config" }
gateway-drain = { path = "../gateway-drain" }
gateway-extension = { path = "../gateway-extension" }
gateway-state = { path = "../gateway-state" }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-stream = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
parking_lot = "0.12"
prometheus-client = "0.25"
rand = "0.9"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
gateway-extension-impls = { path = "../gateway-extension-impls" }
h2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tracing-subscriber = "0.3"

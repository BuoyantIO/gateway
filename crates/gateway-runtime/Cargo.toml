[package]
name = "gateway-runtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.23"
bytes.workspace = true
form_urlencoded = "1"
gateway-config.workspace = true
gateway-drain.workspace = true
gateway-extension.workspace = true
gateway-state.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tokio-stream.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server", "client"] }
hyper-util = { workspace = true, features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
parking_lot.workspace = true
prometheus-client.workspace = true
rand.workspace = true
regex.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "std", "logging"] }
rustls-native-certs = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "logging"] }
tower-service = "0.3"
tracing.workspace = true

[dev-dependencies]
futures.workspace = true
gateway-extension-impls.workspace = true
h2 = "0.4"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

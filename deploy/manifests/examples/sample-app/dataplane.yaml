apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: demo
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gatewayd
          image: gateway-data-plane:latest
          imagePullPolicy: IfNotPresent
          args:
            - --control-plane=http://gateway-cp.gateway-system.svc:8443
            - --client-id=demo/api-gateway
          ports:
            - name: http
              containerPort: 80
          env:
            - name: RUST_LOG
              value: info
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: demo
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

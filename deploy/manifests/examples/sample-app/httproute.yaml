apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: demo
spec:
  parentRefs:
    - name: api-gateway
  hostnames:
    - app.example.com
  rules:
    # Exact `/healthz` — wins over the PathPrefix `/` rule when the
    # request path equals `/healthz` exactly.
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: echo
          port: 8080
    # Catch-all prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 8080

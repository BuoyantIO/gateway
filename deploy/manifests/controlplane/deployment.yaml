apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-cp
  namespace: gateway-system
  labels:
    app: gateway-cp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-cp
  template:
    metadata:
      labels:
        app: gateway-cp
    spec:
      serviceAccountName: gateway-cp
      containers:
        - name: gateway-cp
          image: gateway-control-plane:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen=0.0.0.0:8443
            - --controller-name=gateway.buoyant.io/controller
            # Data-plane provisioning: the CP deploys a gatewayd
            # Deployment + Service per owned Gateway.
            - --dp-image=gateway-data-plane:latest
            - --cp-url=http://gateway-cp.gateway-system.svc:8443
          ports:
            - name: grpc
              containerPort: 8443
          env:
            - name: RUST_LOG
              value: info

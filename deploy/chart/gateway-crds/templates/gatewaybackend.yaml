apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewaybackends.gateway.linkerd.io
  annotations:
    # Uninstalling the chart orphans the CRD instead of cascade-deleting
    # every GatewayBackend in the cluster.
    helm.sh/resource-policy: keep
spec:
  group: gateway.linkerd.io
  scope: Namespaced
  names:
    kind: GatewayBackend
    listKind: GatewayBackendList
    plural: gatewaybackends
    singular: gatewaybackend
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [baseURL]
              properties:
                baseURL:
                  description: >-
                    Absolute http or https URL of the upstream. The
                    scheme decides whether the gateway originates TLS
                    and supplies the default port (80 / 443); a path
                    is prepended to the request path on the way
                    upstream, for a provider that serves its API
                    under a subpath (/v1).
                  type: string
                  pattern: '^https?://'
                tls:
                  description: >-
                    Transport settings for the TLS an https baseURL
                    already implies. Absent means the defaults: the
                    platform trust store, the URL's host as SNI, and
                    both HTTP versions offered.
                  type: object
                  properties:
                    ca:
                      description: >-
                        A Secret in this object's namespace carrying
                        the CA chain under tls.crt, which becomes the
                        only trust root. Absent uses the platform
                        trust store. A kubernetes.io/tls Secret has
                        that key by construction; its private key is
                        ignored here.
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                          minLength: 1
                    sni:
                      description: >-
                        Name sent as SNI and verified against the
                        upstream certificate. Absent uses the baseURL
                        host.
                      type: string
                      minLength: 1
                    alpn:
                      description: >-
                        Protocols offered in the handshake, in
                        preference order, and therefore what decides
                        the HTTP version upstream. Absent offers both;
                        an explicitly empty list offers no ALPN at
                        all, which settles on HTTP/1.1.
                      type: array
                      items:
                        type: string
                        enum: [h2, http/1.1]
                    insecureSkipVerify:
                      description: >-
                        Accept any certificate, from anyone, for any
                        name. For development and integration testing
                        against an endpoint whose chain the gateway
                        has no way to trust; never in production, and
                        it overrides ca.
                      type: boolean
                      default: false
                auth:
                  description: >-
                    The credential the gateway presents on every
                    request it forwards here. Absent sends none.
                  type: object
                  required: [type]
                  properties:
                    type:
                      description: >-
                        Which scheme this block configures. The field
                        of the same name carries it.
                      type: string
                      enum: [ApiKey, OAuth2]
                    apiKey:
                      description: >-
                        A credential the operator provisioned, sent
                        verbatim in one header.
                      type: object
                      required: [secretRef]
                      properties:
                        secretRef:
                          description: >-
                            The Secret holding the credential, and
                            the data key inside it. Any Secret type
                            will do; the key names what to read.
                          type: object
                          required: [name, key]
                          properties:
                            name:
                              type: string
                              minLength: 1
                            key:
                              type: string
                              minLength: 1
                        header:
                          description: >-
                            Header the credential is sent in. Absent
                            sends Authorization.
                          type: string
                          minLength: 1
                        prefix:
                          description: >-
                            Prepended to the credential inside the
                            header value. Absent sends "Bearer ";
                            an explicitly empty string sends the
                            credential with nothing in front of it.
                          type: string
                    oauth2:
                      description: >-
                        The OAuth2 client-credentials grant: the
                        gateway presents its own credentials to a
                        token endpoint and sends the access token it
                        gets back. Nothing about the request being
                        proxied takes part.
                      type: object
                      required: [tokenURL, clientID, clientSecretRef]
                      properties:
                        tokenURL:
                          description: >-
                            Absolute http or https URL of the token
                            endpoint. Often not on the backend's own
                            host.
                          type: string
                          pattern: '^https?://'
                        clientID:
                          description: >-
                            The gateway's client identifier. Public
                            by construction, so it is config rather
                            than a secret reference.
                          type: string
                          minLength: 1
                        clientSecretRef:
                          description: >-
                            The Secret holding the client secret, and
                            the data key inside it. Any Secret type
                            will do; the key names what to read.
                          type: object
                          required: [name, key]
                          properties:
                            name:
                              type: string
                              minLength: 1
                            key:
                              type: string
                              minLength: 1
                        scopes:
                          description: >-
                            Scopes asked for. Absent asks for none,
                            which is what a provider that scopes by
                            client identity expects.
                          type: array
                          items:
                            type: string
                        clientAuthMethod:
                          description: >-
                            How the client secret is presented to the
                            token endpoint. Absent uses Basic, the
                            method RFC 6749 says a client SHOULD use.
                          type: string
                          enum: [ClientSecretBasic, ClientSecretPost]
                  x-kubernetes-validations:
                    - rule: 'self.type != "ApiKey" || has(self.apiKey)'
                      message: 'auth.type ApiKey requires auth.apiKey'
                    - rule: 'self.type != "OAuth2" || has(self.oauth2)'
                      message: 'auth.type OAuth2 requires auth.oauth2'
              x-kubernetes-validations:
                - rule: '!has(self.tls) || self.baseURL.startsWith("https://")'
                  message: 'tls settings require an https baseURL'
            status:
              type: object
              properties:
                conditions:
                  description: >-
                    Accepted says the object itself is usable;
                    ResolvedRefs says everything it names was found.
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.baseURL
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Refs
          type: string
          jsonPath: .status.conditions[?(@.type=="ResolvedRefs")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
